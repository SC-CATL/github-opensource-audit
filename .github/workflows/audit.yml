name: Open Source Audit

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # 历史扫描需要完整历史

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run audit
        run: python scripts/audit_repo.py . --history --license MIT --no-prompt --md audit-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-report
          path: audit-report.md
